name: Deploy to Aliyun

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 打包直传并在服务器重建
        env:
          SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$ALIYUN_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # 源码打包后经 SSH 管道直接流入服务器解压，服务器无需访问 GitHub
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.env -czf - . | \
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=20 -o ServerAliveCountMax=15 -o TCPKeepAlive=yes \
              "$ALIYUN_USER@$ALIYUN_HOST" '
            set -e
            # 保留服务器上的 .env（含 DeepSeek Key 等私密配置，不入仓库）
            cp ~/sensor-hx/.env /tmp/sensor-hx.env.bak 2>/dev/null || true
            rm -rf ~/sensor-hx
            mkdir -p ~/sensor-hx
            tar -xzf - -C ~/sensor-hx
            cp /tmp/sensor-hx.env.bak ~/sensor-hx/.env 2>/dev/null || true
            cd ~/sensor-hx
            # 注入/更新 AI 配置（值由 GitHub Actions 替换，日志自动脱敏）
            touch .env
            grep -v -E "^(AI_PROVIDER|KIMI_API_KEY|KIMI_BASE_URL|KIMI_MODEL)=" .env > .env.tmp || true
            {
              echo "AI_PROVIDER=${{ secrets.AI_PROVIDER }}"
              echo "KIMI_API_KEY=${{ secrets.KIMI_API_KEY }}"
              echo "KIMI_BASE_URL=${{ secrets.KIMI_BASE_URL }}"
              echo "KIMI_MODEL=${{ secrets.KIMI_MODEL }}"
            } >> .env.tmp
            mv .env.tmp .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
          '
