name: Deploy to Aliyun

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 打包源码
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.env \
            -czf deploy.tar.gz .

      - name: 上传到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "~/"

      - name: 解压并重建容器
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script: |
            set -e
            # 保留服务器上的 .env（含 DeepSeek Key 等私密配置，不入仓库）
            cp ~/sensor-hx/.env /tmp/sensor-hx.env.bak 2>/dev/null || true
            rm -rf ~/sensor-hx
            mkdir -p ~/sensor-hx
            tar -xzf ~/deploy.tar.gz -C ~/sensor-hx
            rm -f ~/deploy.tar.gz
            cp /tmp/sensor-hx.env.bak ~/sensor-hx/.env 2>/dev/null || true
            cd ~/sensor-hx
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
